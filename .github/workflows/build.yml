name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  targets:
    name: Collect targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.branch }} ${{ matrix.target.minecraft }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Eighteen jobs resolving dependencies at once gets the runners rate
      # limited by Maven Central (HTTP 429). Six at a time still finishes the
      # whole matrix in a few minutes.
      max-parallel: 6
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ":${{ matrix.target.branch }}:${{ matrix.target.minecraft }}:build" --configure-on-demand

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.branch }}-${{ matrix.target.minecraft }}
          path: ${{ matrix.target.branch }}/**/build/libs/*.jar
          if-no-files-found: error
