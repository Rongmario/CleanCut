name: Publish

# Publishing runs off a GitHub release: tag it, write the release notes, and
# every target in .github/targets.json goes out to Modrinth and CurseForge.
# Use the manual trigger with `dry_run` first to check what would be uploaded.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate the uploads without sending them
        type: boolean
        default: true

jobs:
  targets:
    name: Collect targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # A jar carries the version from gradle.properties, not the tag. Without
      # this, tagging v7.0.1 while mod_version still says 7.0.0 publishes 95
      # files under the old version, and CurseForge files can't be replaced.
      - name: Check the tag matches mod_version
        if: github.event_name == 'release'
        run: |
          declared=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          tagged=${GITHUB_REF_NAME#v}
          if [ "$declared" != "$tagged" ]; then
            echo "::error::release ${GITHUB_REF_NAME} would publish mod_version ${declared}; bump gradle.properties or retag"
            exit 1
          fi

      - id: read
        run: echo "matrix=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.target.branch }} ${{ matrix.target.minecraft }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # Uploads are independent; one bad target shouldn't cancel the rest.
      fail-fast: false
      # Each job decompiles its own Minecraft, so a target costs minutes, and
      # there are 95 of them - serial uploads would run most of a day. Four at
      # a time matches the build workflow's headroom against Maven Central and
      # stays well inside both platforms' upload rate limits.
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Per-target, for the same reason as the build workflow: Minecraft 26
      # needs a Java 25 daemon, the rest are built on 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        # Retried for the same reason as the build workflow. publishMods is
        # idempotent up to the point of upload, and a run that got as far as
        # uploading doesn't fail this way.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew ":${{ matrix.target.branch }}:${{ matrix.target.minecraft }}:publishMods" --configure-on-demand; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed, retrying in $((attempt * 45))s"
            sleep $((attempt * 45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.branch }}-${{ matrix.target.minecraft }}
          path: ${{ matrix.target.branch }}/**/build/libs/*.jar
          if-no-files-found: error
