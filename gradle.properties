org.gradle.jvmargs = -Xmx3G
# Stonecutter rewrites shared sources in place; keep version builds serial.
org.gradle.parallel = false
org.gradle.caching = true

mod_id = cleancut
mod_name = CleanCut
mod_version = 8.0.1
mod_group = zone.rong
mod_description = Fight enemies back through grass and other similar obstructions!
mod_author = Rongmario
mod_license = MIT
