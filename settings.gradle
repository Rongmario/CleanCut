pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.7.11'
}

// One branch per mod loader, one version per supported Minecraft release.
// Adding a target is two edits: a version here, and a row in that branch's
// `versionData` table in <branch>/build.gradle. See README.md.
stonecutter {
    create(rootProject) {
        centralScript.set('build.gradle')

        branch('fabric') { fabric ->
            fabric.versions(
                    '1.14.4', '1.15.2', '1.16.5', '1.17.1', '1.18.2',
                    '1.19.2', '1.19.4',
                    '1.20.1', '1.20.4', '1.20.6',
                    '1.21.1', '1.21.4', '1.21.5', '1.21.6', '1.21.7',
                    '1.21.8'
                    // 1.21.9+ needs Yarn's unpick v3, which needs Loom 1.17,
                    // which needs Gradle 9. See "Newer Minecraft" in README.md.
            )
        }

        branch('forge') { forge ->
            forge.versions('1.18.2', '1.19.2', '1.19.4', '1.20.1')
        }

        branch('neoforge') { neoforge ->
            neoforge.versions('1.21.1', '1.21.4')
        }

        // The version the source tree sits on when checked out fresh.
        vcsVersion.set('1.20.1')
    }
}

rootProject.name = 'CleanCut'
