pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.7.11'
}

// One branch per mod loader, one version per supported Minecraft release.
// Adding a target is two edits: a version here, and a row in that branch's
// `versionData` table in <branch>/build.gradle. See README.md.
stonecutter {
    create(rootProject) {
        centralScript.set('build.gradle')

        // Every Minecraft release each loader ever shipped for, from 1.14.4
        // up. Gaps are releases that loader skipped, not omissions - see the
        // tables in <branch>/build.gradle.
        branch('fabric') { fabric ->
            fabric.versions(
                    '1.14.4',
                    '1.15', '1.15.1', '1.15.2',
                    '1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
                    '1.17', '1.17.1',
                    '1.18', '1.18.1', '1.18.2',
                    '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
                    '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
                    '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
                    '1.21.6', '1.21.7', '1.21.8',
                    '1.21.9', '1.21.10', '1.21.11'
                    // 26.1 and later have no Yarn at all - see "Newer
                    // Minecraft" in README.md.
            )
        }

        // No Forge for 1.16 or 1.17: it went straight to 1.16.1 and 1.17.1.
        // None for 1.20.5 or 1.21.2 either - Forge skipped both. 1.16.1 and
        // 1.16.2 are missing because Loom can't build them; see the comment in
        // forge/build.gradle.
        branch('forge') { forge ->
            forge.versions(
                    '1.14.4',
                    '1.15', '1.15.1', '1.15.2',
                    '1.16.3', '1.16.4', '1.16.5',
                    '1.17.1',
                    '1.18', '1.18.1', '1.18.2',
                    '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
                    '1.20', '1.20.1', '1.20.2', '1.20.4', '1.20.6',
                    '1.21', '1.21.1', '1.21.3', '1.21.4', '1.21.5',
                    '1.21.6', '1.21.7', '1.21.8',
                    '1.21.9', '1.21.10', '1.21.11'
                    // 26.1 and later need Java 25. See "Newer Minecraft" in
                    // README.md.
            )
        }

        // NeoForge starts here: its first release was for 1.20.2. Its 1.20.1
        // build is the Forge fork, still under net.minecraftforge - the Forge
        // 1.20.1 jar is the NeoForge 1.20.1 jar. See README.md.
        branch('neoforge') { neoforge ->
            neoforge.versions(
                    '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
                    '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
                    '1.21.6', '1.21.7', '1.21.8',
                    '1.21.9'
                    // 1.21.10 and later are packaged in a way this Loom can't
                    // read; 26.1 and later need Java 25. See "Newer Minecraft"
                    // in README.md.
            )
        }

        // The version the source tree sits on when checked out fresh. It has to
        // be one every branch builds, and NeoForge's floor is 1.20.2.
        vcsVersion.set('1.20.2')
    }
}

rootProject.name = 'CleanCut'

// Architectury Loom reads its platform from a Gradle property, and needs it
// before the plugin is applied - too early for the build script. Setting it
// here beats a near-identical gradle.properties in all forty-odd generated
// version directories.
gradle.beforeProject { project ->
    def branch = project.parent?.name
    if (branch == 'forge' || branch == 'neoforge') {
        project.extensions.extraProperties.set('loom.platform', branch)
    }
}
