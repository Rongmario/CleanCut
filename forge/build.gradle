plugins {
    // Minecraft 26 ships unobfuscated, and Loom takes a different plugin for
    // that - remapping a jar that was never obfuscated is not a no-op, it is a
    // step that has nothing to work from. Both are declared and one is applied
    // below, once the version being built is known.
    id 'dev.architectury.loom' version '1.17.485' apply false
    id 'dev.architectury.loom-no-remap' version '1.17.485' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

apply plugin: stonecutter.current.version.startsWith('26')
        ? 'dev.architectury.loom-no-remap'
        : 'dev.architectury.loom'

// Everything that differs between Minecraft versions on this loader. Adding a
// version means adding a row here and listing it in settings.gradle.
// Forge/NeoForge build numbers are pinned: Architectury Loom resolves the
// userdev artifact itself and cannot handle a dynamic version.
// Each row is Forge's own recommended build for that Minecraft version, taken
// from files.minecraftforge.net, except where that build turned out not to
// work with this Loom and the newest one does.
//
// Gaps are versions Forge never shipped, with three exceptions. Architectury
// Loom 1.10 cannot handle 1.16.1 at all, where remapping Minecraft dies on a
// name conflict, nor 1.16.2, where the mixin annotation processor is handed no
// SRG mappings and so can't write a refmap. And 1.20.3-49.0.2 asks for
// net.minecraftforge:bootstrap-dev:2.0.0, which was never published; a later
// build off the 49 line may well work, but its numbers couldn't be checked
// from where this was written. NeoForge covers 1.20.3.
def versionData = [
        '1.14.4': [forge: '1.14.4-28.2.26', java: 8],
        '1.15'  : [forge: '1.15-29.0.4', java: 8],
        '1.15.1': [forge: '1.15.1-30.0.51', java: 8],
        '1.15.2': [forge: '1.15.2-31.2.57', java: 8],
        '1.16.3': [forge: '1.16.3-34.1.42', java: 8],
        '1.16.4': [forge: '1.16.4-35.1.4', java: 8],
        '1.16.5': [forge: '1.16.5-36.2.34', java: 8],
        '1.17.1': [forge: '1.17.1-37.1.1', java: 16],
        '1.18'  : [forge: '1.18-38.0.17', java: 17],
        '1.18.1': [forge: '1.18.1-39.1.0', java: 17],
        '1.18.2': [forge: '1.18.2-40.3.0', java: 17],
        '1.19'  : [forge: '1.19-41.1.0', java: 17],
        '1.19.1': [forge: '1.19.1-42.0.9', java: 17],
        '1.19.2': [forge: '1.19.2-43.5.0', java: 17],
        '1.19.3': [forge: '1.19.3-44.1.0', java: 17],
        '1.19.4': [forge: '1.19.4-45.4.0', java: 17],
        '1.20'  : [forge: '1.20-46.0.14', java: 17],
        '1.20.1': [forge: '1.20.1-47.4.10', java: 17],
        '1.20.2': [forge: '1.20.2-48.1.0', java: 17],
        '1.20.4': [forge: '1.20.4-49.2.0', java: 17],
        '1.20.6': [forge: '1.20.6-50.2.0', java: 21],
        '1.21'  : [forge: '1.21-51.0.33', java: 21],
        '1.21.1': [forge: '1.21.1-52.1.0', java: 21],
        '1.21.3': [forge: '1.21.3-53.1.0', java: 21],
        '1.21.4': [forge: '1.21.4-54.1.14', java: 21],
        '1.21.5': [forge: '1.21.5-55.1.0', java: 21],
        '1.21.6': [forge: '1.21.6-56.0.9', java: 21],
        '1.21.7': [forge: '1.21.7-57.0.3', java: 21],
        '1.21.8': [forge: '1.21.8-58.1.0', java: 21],
        '1.21.9': [forge: '1.21.9-59.0.5', java: 21],
        '1.21.10': [forge: '1.21.10-60.1.13', java: 21],
        '1.21.11': [forge: '1.21.11-61.1.14', java: 21],
        '26.1'  : [forge: '26.1-62.0.9', java: 25],
        '26.1.1': [forge: '26.1.1-63.0.2', java: 25],
        '26.1.2': [forge: '26.1.2-64.1.0', java: 25],
        '26.2'  : [forge: '26.2-65.1.0', java: 25],
]

def minecraftVersion = stonecutter.current.version
def unobfuscated = minecraftVersion.startsWith('26')
def target = versionData[minecraftVersion]
if (target == null) {
    throw new GradleException("No Forge build data for Minecraft ${minecraftVersion}; add a row to forge/build.gradle")
}

// Derived rather than written out per row: the loader range is "this Forge
// major or newer", and the Minecraft range is this version only. Bumping the
// last number gives the exclusive upper bound - it needn't be a real release.
def forgeMajor = target.forge.substring(target.forge.indexOf('-') + 1).tokenize('.')[0]
def loaderRange = "[${forgeMajor},)"
def nextMinecraft = { String mc ->
    def parts = mc.tokenize('.')
    while (parts.size() < 3) {
        parts << '0'
    }
    parts[-1] = (parts[-1] as int) + 1
    parts.join('.')
}
def minecraftRange = "[${minecraftVersion},${nextMinecraft(minecraftVersion)})"

version = "${mod_version}+${minecraftVersion}"
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraftVersion}"
}

// Forge started bundling Mixin partway through the 1.15.2 cycle (31.2.x).
// Before that - 1.14.4, 1.15 and 1.15.1 - a mixin mod has to bring its own,
// both to compile against and to load at runtime. See the bootstrap package.
def shadesMixin = minecraftVersion in ['1.14.4', '1.15', '1.15.1']
def mixinVersion = '0.8.5'
// Mixin builds its class-check extension unconditionally, and that needs
// asm-util, which none of these Forge versions puts on the class path - they
// ship asm, asm-tree and asm-commons only. So it gets shaded too, at the exact
// ASM version that Forge already has: everything else ASM delegates to the
// parent loader first, and a newer asm-util against an older asm core is how
// you get a NoSuchMethodError instead of a missing class.
def asmVersion = ['1.14.4': '6.2', '1.15': '7.2', '1.15.1': '7.2'][minecraftVersion]

repositories {
    // Also where Mixin itself comes from, for the versions that shade it -
    // adding a second repository here upsets Loom's repository handling.
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

// Mixin classes go into the jar itself on the versions Forge doesn't supply
// them. Everywhere else this configuration stays empty.
configurations {
    shaded
}

loom {
    silentMojangMappingsLicense()
    // No refmap anywhere in here, on any version. A refmap maps mixin targets
    // back to obfuscated names, and this Loom doesn't produce one: it defaults
    // to `useLegacyMixinAp = false` and rewrites the annotations themselves
    // into SRG inside remapJar. Declaring one in cleancut.mixins.json would
    // just point Mixin at a file the build never writes.
    //
    // mixinConfig still matters - it puts the config in the jar manifest,
    // which is how Forge finds it. The no-remap plugin used for Minecraft 26
    // sets that up itself before this script runs.
    if (!unobfuscated) {
        forge {
            mixinConfig "${mod_id}.mixins.json"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // Minecraft 26 ships unobfuscated - the jar already carries real names,
    // and Mojang stopped publishing mappings because nothing is left to map.
    // Declaring any mappings there is an error, not a no-op.
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    forge "net.minecraftforge:forge:${target.forge}"

    if (shadesMixin) {
        // Compile against Mixin, then put it in the jar.
        //
        // Deliberately no `annotationProcessor` for Mixin here. This Loom runs
        // with `useLegacyMixinAp = false`: it rewrites mixin annotations into
        // SRG names inside remapJar instead of having Mixin's processor emit a
        // refmap. Adding the processor by hand puts it on the compile path
        // without any of the mapping arguments Loom used to pass with it, and
        // it then fails outright with "Unable to locate obfuscation mapping
        // for @Redirect target". Every other Forge version here already builds
        // through the remapper; these three are no different.
        compileOnly "org.spongepowered:mixin:${mixinVersion}"
        shaded "org.spongepowered:mixin:${mixinVersion}"
        // Just asm-util, not the ASM it was built against - taking its
        // transitives would put a whole second copy of ASM in the jar.
        shaded("org.ow2.asm:asm-util:${asmVersion}") { transitive = false }
        shaded("org.ow2.asm:asm-analysis:${asmVersion}") { transitive = false }
    }
}

// The ModLauncher service that starts Mixin is only wanted where Mixin is
// shaded; on every other version Forge has already done all of this, and
// running it twice would be worse than not running it at all.
sourceSets.main.java {
    if (!shadesMixin) {
        exclude 'zone/rong/cleancut/bootstrap/**'
    }
}

processResources {
    def properties = [
            version              : version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_description      : mod_description,
            mod_author           : mod_author,
            mod_license          : mod_license,
            mod_homepage         : mod_homepage,
            mod_sources          : mod_sources,
            mod_issues           : mod_issues,
            minecraft_dependency : minecraftRange,
            loader_version_range : loaderRange,
            mixin_compat         : "JAVA_${target.java}",
    ]
    inputs.properties(properties)
    filesMatching(['META-INF/mods.toml', '*.mixins.json']) {
        expand(properties)
    }
    // Same reasoning as the source exclusion above: no bootstrap service
    // registration on versions where Forge starts Mixin itself.
    if (!shadesMixin) {
        exclude 'META-INF/services/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    if (shadesMixin) {
        // Mixin's own classes, plus the META-INF/services entries that make
        // ModLauncher pick up its launch plugin. Forge's mod directory scanner
        // reads services straight out of the jars in mods/, which is what makes
        // a shaded Mixin work at all on these versions.
        // Wrapped in a closure so the configuration is resolved when the jar is
        // built, not while the project is being configured - resolving it early
        // uses Loom's repositories before Loom has finished setting them up.
        from({ configurations.shaded.collect { zipTree(it) } }) {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
            // Mixin's annotation processor did its work at compile time and has
            // no business in a shipped jar.
            exclude 'org/spongepowered/tools/**'
            exclude 'META-INF/services/javax.annotation.processing.Processor'
            exclude 'META-INF/services/org.spongepowered.tools.obfuscation.service.IObfuscationService'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

publishMods {
    // No remapJar where nothing is obfuscated: the jar off the compiler is
    // already the jar that ships.
    file = (unobfuscated ? tasks.jar : tasks.remapJar).archiveFile
    displayName = "${mod_name} ${mod_version} - Forge ${minecraftVersion}"
    version = "${mod_version}+${minecraftVersion}-forge"
    changelog = providers.environmentVariable('CHANGELOG')
            .orElse("See ${mod_sources}/releases".toString())
    type = STABLE
    modLoaders.add('forge')
    dryRun.set(providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false))

    if (modrinth_id) {
        modrinth {
            projectId = modrinth_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraftVersion)
        }
    }

    if (curseforge_id) {
        curseforge {
            projectId = curseforge_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraftVersion)
            clientRequired = true
            serverRequired = false
        }
    }
}
