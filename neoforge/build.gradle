plugins {
    // Minecraft 26 ships unobfuscated, and Loom takes a different plugin for
    // that - remapping a jar that was never obfuscated is not a no-op, it is a
    // step that has nothing to work from. Both are declared and one is applied
    // below, once the version being built is known.
    id 'dev.architectury.loom' version '1.17.485' apply false
    id 'dev.architectury.loom-no-remap' version '1.17.485' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

apply plugin: stonecutter.current.version.startsWith('26')
        ? 'dev.architectury.loom-no-remap'
        : 'dev.architectury.loom'

// Everything that differs between Minecraft versions on this loader. Adding a
// version means adding a row here and listing it in settings.gradle.
// Pinned rather than a range: Architectury Loom resolves the userdev artifact
// itself and cannot handle a dynamic version.
// NeoForge's version number encodes the Minecraft one: 21.4.x is Minecraft
// 1.21.4. The newest stable build of each line is pinned; a few lines never
// left beta, and those are marked. 1.20.2 is as far back as NeoForge goes.
def versionData = [
        '1.20.2': [neoforge: '20.2.93', java: 17],
        '1.20.3': [neoforge: '20.3.8-beta', java: 17],   // no stable build
        '1.20.4': [neoforge: '20.4.251', java: 17],
        '1.20.5': [neoforge: '20.5.21-beta', java: 21],  // no stable build
        '1.20.6': [neoforge: '20.6.139', java: 21],
        '1.21'  : [neoforge: '21.0.167', java: 21],
        '1.21.1': [neoforge: '21.1.248', java: 21],
        '1.21.2': [neoforge: '21.2.1-beta', java: 21],   // no stable build
        '1.21.3': [neoforge: '21.3.97', java: 21],
        '1.21.4': [neoforge: '21.4.157', java: 21],
        '1.21.5': [neoforge: '21.5.98', java: 21],
        '1.21.6': [neoforge: '21.6.20-beta', java: 21],  // no stable build
        '1.21.7': [neoforge: '21.7.25-beta', java: 21],  // no stable build
        '1.21.8': [neoforge: '21.8.54', java: 21],
        '1.21.9': [neoforge: '21.9.16-beta', java: 21],   // no stable build
        '26.1'  : [neoforge: '26.1.0.19-beta', java: 25],  // no stable build
        '26.1.1': [neoforge: '26.1.1.15-beta', java: 25],  // no stable build
        '26.1.2': [neoforge: '26.1.2.93', java: 25],   // .94 has no installer
        '26.2'  : [neoforge: '26.2.0.48-beta', java: 25],  // no stable build
        // No 26.3 row: NeoForge has published nothing for that line yet.
]

def minecraftVersion = stonecutter.current.version
def unobfuscated = minecraftVersion.startsWith('26')
def target = versionData[minecraftVersion]
if (target == null) {
    throw new GradleException("No NeoForge build data for Minecraft ${minecraftVersion}; add a row to neoforge/build.gradle")
}

// Derived rather than written out per row: the NeoForge range is "this
// NeoForge line or newer", and the Minecraft range is this version only.
// Taken from the Minecraft version rather than NeoForge's own, because the
// two don't have the same shape: 1.21.8 is NeoForge 21.8.x, three parts, while
// 26.1.2 is NeoForge 26.1.2.x, four. Dropping Minecraft's leading "1." gives
// the line in both schemes.
// A snapshot id carries a suffix that is no part of either scheme's numbering
// - NeoForge spells its snapshot builds 26.1.0.0-alpha.11+snapshot-7, with the
// line still numeric - so the line is what's left before the dash.
def neoLine = minecraftVersion.startsWith('1.') ? minecraftVersion.substring(2) : minecraftVersion
neoLine = neoLine.split('-', 2)[0]
def neoforgeRange = "[${neoLine},)"
// `loaderVersion` is not that. It is the version of the javafml language
// provider, which NeoForge numbers on its own line - 1.21.8 ships javafml
// 9.0.18, not 21.8 - so asking for the NeoForge line there demands a language
// provider that will never exist and the mod is rejected before it loads.
// Anything from 1 up, as NeoForge's own template does; the real constraint is
// the neoforge dependency, which is versioned properly.
def languageRange = '[1,)'
// The upper bound of "this Minecraft version only". A snapshot is already the
// tail of its line, so the bound is the line itself: 26.3-snapshot-7 is below
// 26.3, and stops there.
def nextMinecraft = { String mc ->
    if (mc.contains('-')) {
        return mc.split('-', 2)[0]
    }
    def parts = mc.tokenize('.')
    while (parts.size() < 3) {
        parts << '0'
    }
    parts[-1] = (parts[-1] as int) + 1
    parts.join('.')
}
def minecraftRange = "[${minecraftVersion},${nextMinecraft(minecraftVersion)})"

// The mod metadata file was called META-INF/mods.toml until NeoForge 21.0
// renamed it. One file in the source tree, emitted under whichever name this
// version reads.
def modsTomlName = neoLine.startsWith('20.') ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'

version = "${mod_version}+${minecraftVersion}"
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-${minecraftVersion}"
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

// NeoForge mods ship against Mojang mappings, so mixins need no refmap and
// Loom keeps the legacy mixin annotation processor switched off here.
loom {
    silentMojangMappingsLicense()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // Minecraft 26 ships unobfuscated - the jar already carries real names,
    // and Mojang stopped publishing mappings because nothing is left to map.
    // Declaring any mappings there is an error, not a no-op.
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    neoForge "net.neoforged:neoforge:${target.neoforge}"
}

// Forge turns every mod jar into a resource pack and reads pack.mcmeta out of
// it. A jar without one makes Pack.readPackMetadata return null, which Forge
// raises as ModLoadingStage.ERROR ("fml.modloading.brokenresources") and the
// game stops on the loading-error screen. The number itself only decides a
// compatibility warning on a pack the player never sees - these mod packs are
// merged into the hidden "Mod resources" entry - so an unlisted version
// falling back to the newest known value costs nothing.
def packFormats = [
        '1.14.4': 4,
        '1.15'  : 5, '1.15.1': 5, '1.15.2': 5,
        '1.16'  : 5, '1.16.1': 5,
        '1.16.2': 6, '1.16.3': 6, '1.16.4': 6, '1.16.5': 6,
        '1.17'  : 7, '1.17.1': 7,
        '1.18'  : 8, '1.18.1': 8, '1.18.2': 8,
        '1.19'  : 9, '1.19.1': 9, '1.19.2': 9,
        '1.19.3': 12, '1.19.4': 13,
        '1.20'  : 15, '1.20.1': 15, '1.20.2': 18, '1.20.3': 22, '1.20.4': 22,
        '1.20.5': 32, '1.20.6': 32,
        '1.21'  : 34, '1.21.1': 34, '1.21.2': 42, '1.21.3': 42, '1.21.4': 46,
        '1.21.5': 55, '1.21.6': 63, '1.21.7': 64, '1.21.8': 64,
]
def packFormat = packFormats[minecraftVersion] ?: packFormats.values().max()

processResources {
    def properties = [
            version              : version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_description      : mod_description,
            mod_author           : mod_author,
            mod_license          : mod_license,
            mod_homepage         : mod_homepage,
            mod_sources          : mod_sources,
            mod_issues           : mod_issues,
            minecraft_dependency : minecraftRange,
            loader_version_range : languageRange,
            neoforge_dependency  : neoforgeRange,
            mixin_compat         : "JAVA_${target.java}",
            pack_format          : packFormat,
    ]
    inputs.properties(properties)
    inputs.property('modsTomlName', modsTomlName)
    filesMatching(['META-INF/neoforge.mods.toml', '*.mixins.json', 'pack.mcmeta']) {
        expand(properties)
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        path = modsTomlName
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

publishMods {
    // No remapJar where nothing is obfuscated: the jar off the compiler is
    // already the jar that ships.
    file = (unobfuscated ? tasks.jar : tasks.remapJar).archiveFile
    displayName = "${mod_name} ${mod_version} - NeoForge ${minecraftVersion}"
    version = "${mod_version}+${minecraftVersion}-neoforge"
    changelog = providers.environmentVariable('CHANGELOG')
            .orElse("See ${mod_sources}/releases".toString())
    type = STABLE
    modLoaders.add('neoforge')
    dryRun.set(providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false))

    if (modrinth_id) {
        modrinth {
            projectId = modrinth_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraftVersion)
        }
    }

    if (curseforge_id) {
        curseforge {
            projectId = curseforge_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraftVersion)
            clientRequired = true
            serverRequired = false
        }
    }
}
