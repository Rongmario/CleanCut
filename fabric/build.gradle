plugins {
    // Minecraft 26 ships unobfuscated, and Fabric Loom has no mode for that -
    // it requires a mappings dependency that no longer exists for those
    // versions. Architectury Loom's no-remap plugin does, and it drives the
    // Fabric platform as well as the other two.
    id 'fabric-loom' version '1.17.17' apply false
    id 'dev.architectury.loom-no-remap' version '1.17.485' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

apply plugin: stonecutter.current.version.startsWith('26')
        ? 'dev.architectury.loom-no-remap'
        : 'fabric-loom'

// Everything that differs between Minecraft versions on this loader. Adding a
// version means adding a row here and listing it in settings.gradle.
// `mappings` is the Yarn build - null from 26, which ships unobfuscated and so
// has no Yarn at all. `java` is the release level that version of Minecraft
// compiles against. `loader` overrides the Fabric Loader in gradle.properties
// for versions that one is too old for.
def versionData = [
        '1.14.4': [mappings: '1.14.4+build.18', java: 8],
        '1.15'  : [mappings: '1.15+build.2', java: 8],
        '1.15.1': [mappings: '1.15.1+build.37', java: 8],
        '1.15.2': [mappings: '1.15.2+build.17', java: 8],
        '1.16'  : [mappings: '1.16+build.4', java: 8],
        '1.16.1': [mappings: '1.16.1+build.21', java: 8],
        '1.16.2': [mappings: '1.16.2+build.47', java: 8],
        '1.16.3': [mappings: '1.16.3+build.47', java: 8],
        '1.16.4': [mappings: '1.16.4+build.9', java: 8],
        '1.16.5': [mappings: '1.16.5+build.10', java: 8],
        '1.17'  : [mappings: '1.17+build.13', java: 16],
        '1.17.1': [mappings: '1.17.1+build.65', java: 16],
        '1.18'  : [mappings: '1.18+build.1', java: 17],
        '1.18.1': [mappings: '1.18.1+build.22', java: 17],
        '1.18.2': [mappings: '1.18.2+build.4', java: 17],
        '1.19'  : [mappings: '1.19+build.4', java: 17],
        '1.19.1': [mappings: '1.19.1+build.6', java: 17],
        '1.19.2': [mappings: '1.19.2+build.28', java: 17],
        '1.19.3': [mappings: '1.19.3+build.5', java: 17],
        '1.19.4': [mappings: '1.19.4+build.2', java: 17],
        '1.20'  : [mappings: '1.20+build.1', java: 17],
        '1.20.1': [mappings: '1.20.1+build.10', java: 17],
        '1.20.2': [mappings: '1.20.2+build.4', java: 17],
        '1.20.3': [mappings: '1.20.3+build.1', java: 17],
        '1.20.4': [mappings: '1.20.4+build.3', java: 17],
        '1.20.5': [mappings: '1.20.5+build.1', java: 21],
        '1.20.6': [mappings: '1.20.6+build.3', java: 21],
        '1.21'  : [mappings: '1.21+build.9', java: 21],
        '1.21.1': [mappings: '1.21.1+build.3', java: 21],
        '1.21.2': [mappings: '1.21.2+build.1', java: 21],
        '1.21.3': [mappings: '1.21.3+build.2', java: 21],
        '1.21.4': [mappings: '1.21.4+build.8', java: 21],
        '1.21.5': [mappings: '1.21.5+build.1', java: 21],
        '1.21.6': [mappings: '1.21.6+build.1', java: 21],
        '1.21.7': [mappings: '1.21.7+build.8', java: 21],
        '1.21.8': [mappings: '1.21.8+build.1', java: 21],
        '1.21.9' : [mappings: '1.21.9+build.1', java: 21],
        '1.21.10': [mappings: '1.21.10+build.3', java: 21],
        '1.21.11': [mappings: '1.21.11+build.6', java: 21],
        // Minecraft 26: no Yarn, and a Fabric Loader from the same era as the
        // game rather than the one the 1.x targets are built against.
        '26.1'   : [mappings: null, java: 25, loader: '0.19.3'],
        '26.1.1' : [mappings: null, java: 25, loader: '0.19.3'],
        '26.1.2' : [mappings: null, java: 25, loader: '0.19.3'],
        '26.2'   : [mappings: null, java: 25, loader: '0.19.3'],
        '26.3-snapshot-7': [mappings: null, java: 25, loader: '0.19.3'],
]

def minecraftVersion = stonecutter.current.version
def unobfuscated = minecraftVersion.startsWith('26')
def target = versionData[minecraftVersion]
if (target == null) {
    throw new GradleException("No Fabric build data for Minecraft ${minecraftVersion}; add a row to fabric/build.gradle")
}

def loaderVersion = target.loader ?: fabric_loader_version

// Fabric Loader doesn't go by Minecraft's own version id. It normalises it into
// Fabric's extended semver first, and snapshots lose Mojang's spelling on the
// way: 26.3-snapshot-7 is 26.3-alpha.7 to the loader. A dependency written the
// Mojang way would never match the game it was built for.
def snapshot = (minecraftVersion =~ /^(\d+(?:\.\d+)*)-snapshot-(\d+)$/)
def isSnapshot = snapshot.matches()
def loaderMinecraftVersion = isSnapshot ? "${snapshot.group(1)}-alpha.${snapshot.group(2)}" : minecraftVersion

version = "${mod_version}+${minecraftVersion}"
group = mod_group

base {
    archivesName = "${mod_id}-fabric-${minecraftVersion}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // Minecraft 26 is unobfuscated: no Yarn, no Mojang mappings, nothing to
    // declare. Yarn existed to give obfuscated names meaning, and the names
    // now come in the jar.
    if (target.mappings != null) {
        mappings "net.fabricmc:yarn:${target.mappings}:v2"
    }
    // modImplementation exists to remap a dependency out of intermediary on
    // the way in. With nothing obfuscated the no-remap plugin doesn't register
    // it, and a plain dependency is already the right thing.
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    }
}

processResources {
    def properties = [
            version              : version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_description      : mod_description,
            mod_author           : mod_author,
            mod_license          : mod_license,
            mod_homepage         : mod_homepage,
            mod_sources          : mod_sources,
            mod_issues           : mod_issues,
            minecraft_dependency : "~${loaderMinecraftVersion}",
            mixin_compat         : "JAVA_${target.java}",
    ]
    inputs.properties(properties)
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

publishMods {
    // No remapJar where nothing is obfuscated: the jar off the compiler is
    // already the jar that ships.
    file = (unobfuscated ? tasks.jar : tasks.remapJar).archiveFile
    displayName = "${mod_name} ${mod_version} - Fabric ${minecraftVersion}"
    version = "${mod_version}+${minecraftVersion}-fabric"
    changelog = providers.environmentVariable('CHANGELOG')
            .orElse("See ${mod_sources}/releases".toString())
    // A build for a Minecraft snapshot is only as stable as the snapshot.
    type = isSnapshot ? ALPHA : STABLE
    modLoaders.add('fabric')
    // Quilt Loader reads fabric.mod.json directly, so the Fabric jar is the
    // Quilt jar. Nothing extra to build, but it gets tagged for Quilt users.
    modLoaders.add('quilt')
    dryRun.set(providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false))

    if (modrinth_id) {
        modrinth {
            projectId = modrinth_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraftVersion)
        }
    }

    // Modrinth carries Minecraft snapshots as game versions of their own;
    // CurseForge doesn't, so a snapshot build has nowhere to go there and the
    // upload would be rejected for an unknown version. Modrinth-only for those.
    if (curseforge_id && !isSnapshot) {
        curseforge {
            projectId = curseforge_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraftVersion)
            clientRequired = true
            serverRequired = false
        }
    }
}
